<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;
400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/DIORATESSA LOGO SYMBOL BLACK.png">
<title>Dioratessa Properties</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Georgia,serif;
}

.hero{
position:relative;
width:100%;
height:100vh;
overflow:hidden;animation:fadeIn 2s ease;
}

video{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
min-width:100%;
min-height:100%;
object-fit:cover;
transform:translate(-50%,-50%) scale(0.87);
}

.mobile-video{
display:none;
}

.logo{
position:absolute;
top:60px;
left:70px;
z-index:5;
width:260px;
max-width:45vw;
animation:fade 2s ease;
}

@keyframes fade{
from{
opacity:1;
transform:translateY(-20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes slideInRight{
from{
opacity:0;
transform:translate(80px,-50%);
}
to{
opacity:1;
transform:translateY(-50%);
}
}

.tagline{ position:absolute; right:110px; top:90px;
font-size:16px; font-style:italic;
font-family:Cinzel; color:rgba(255,255,255,.92);
letter-spacing:.5px; z-index:9; opacity:0;
animation:fade 1.5s ease forwards;
animation-delay:2s;
}

.reserve-btn{ position:absolute;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
right:90px; top:53%; transform:translateY(-50%);
padding:20px 120px; border:3px solid #9b7b47;
color:white; text-decoration:none; font-size:14px;
letter-spacing:4px;
font-family:Avenir Next, Avenir, Arial, Sans-serif;
background:rgba(255,255,255,0.015);
backdrop-filter:blur(4px); z-index:10;
opacity:0; animation:slideInRight 1.2s ease forwards;
animation-delay:3s; transition:all .4s ease;
}
.reserve-btn:hover{ background:rgba(0,0,0,0.95);
backdrop-filter:blur(10px);
border:3px solid #0a0a0a;
color:#9b7b47;
transform:translateY(-50%) scale(1.03);
}
@media(max-width:768px){

.desktop-video{
display:none;
}
.tagline{display:none}

.mobile-video{
display:block;
position:absolute;
top:50%;
left:50%;
width:100%;
height:100%;
object-fit:cover;
transform:translate(-50%,-50%);
}

.logo{
width:210px;
max-width:none;
top:40px;
left:25px;
}
.reserve-btn{ display:flex; justify-content:center;
align-items:center; position:absolute; right:25px;
top:auto; bottom:120px; transform:none;
width:calc(100% - 50px); height:58px; padding:0;
border:3px solid #9b7b47; font-family:Avenir Next, Avenir, Arial, Sans-serif;
font-size:14px; letter-spacing:3px; color:white; text-decoration:none;
background:rgba(0,0,0,0.2); backdrop-filter:blur(2px);
z-index:10;
}
.menu-toggle{ position:absolute; top:55px; right:35px; width:35px;
height:15px; background:none; border:none; padding:0; z-index:20; display:flex;
flex-direction:column; justify-content:space-between; }
.menu-toggle span{ display:block; width:100%; height:3px;
background:white; transition:all .4s ease; transform-origin:center;
}

.menu-toggle.active span:first-child{transform:translateY(6px) rotate(45deg);}
.menu-toggle.active span:last-child{transform:translateY(-6px) rotate(-45deg);}
.menu-toggle.active span{background:#c59445;}
}
.mobile-menu{position:absolute;top:0;right:-78%;width:78%;height:100%;
background:white;z-index:15;transition:right .5s ease;}
.menu-toggle.active ~ .mobile-menu{right:0;}
.mobile-menu-content{padding:140px 50px 35px;height:100%;
display:flex;flex-direction:column;}
.mobile-menu-links{display:flex;flex-direction:column;}
.mobile-menu-links a{font-family:Monserrat,Arial,sans-serif;
font-size:15px;font-weight:300;letter-spacing:1px;color:#222;
text-decoration:none;padding:20px 0;border-bottom:1px solid #ddd3c4;
outline:none;-webkit-tap-highlight-color:transparent;}
.collections-link,.contact-link{position:relative;}
.collections-link span,.contact-link span{position:absolute;
right:35px;top:50%;width:11px;height:11px;border-right:1px solid #c59445;
border-bottom:1px solid #c59445;transform:translateY(-65%) rotate(45deg);}
.collections-link span,.contact-link span{transition:transform .25s ease;}
.mobile-menu-email{
position:fixed;
bottom:70px;
left:calc(22% + 70px);
font-family:Arial,sans-serif;
font-size:15px;
letter-spacing:1px;
color:#9b7b47;
z-index:30;
opacity:0;
visibility:hidden;
transition:opacity .3s ease .12s;
}

.menu-toggle.active ~ .mobile-menu .mobile-menu-email{opacity:1;visibility:visible;}





</style>

</head>

<body>

<div class="hero">

<video id="desktopVideo" class="desktop-video" 
autoplay muted loop playsinline preload="metadata"></video>
<video id="mobileVideo" class="mobile-video" 
autoplay muted loop playsinline preload="auto"></video>

<img class="logo" src="images/DIORATESSA AND LOGO 1.png" alt="Dioratessa Properties">
<div
class="tagline">info@dioratessa.com</div>
<button class="menu-toggle"
aria-label="Open menu"><span></span><span></span></button>

<a href="#" class="reserve-btn">VIEW COLLECTION ></a>
<div class="mobile-menu">
<div class="mobile-menu-content">
<div class="mobile-menu-links">
<a href="#">HOME</a>
<a href="#">SERVICES</a>
<a href="#" class="collections-link">COLLECTIONS <span></span></a>
<a href="#">THE TEAM</a>
<a href="#">D Y R A</a>
<a href="#" class="contact-link">CONTACT US <span></span></a>
</div>
<div class="mobile-menu-email">info@dioratessa.com</div>
</div>
</div>
</div>

<script>
document.querySelector('.menu-toggle').addEventListener('click', function(){
this.classList.toggle('active');
});
const desktopVideo = document.getElementById('desktopVideo');
const mobileVideo = document.getElementById('mobileVideo');
if (window.innerWidth <= 768) {
mobileVideo.src = 'videos/V Ok2 WO.mp4';
} else {
desktopVideo.src = 'videos/main video for web short.mp4';
}
const reserveBtn = document.querySelector('.reserve-btn');
reserveBtn.addEventListener('click', function(event) {
if (window.innerWidth <= 768) {
event.preventDefault();
window.location.href = 'https://wa.me/2349090007963';
} else {
event.preventDefault();
}
});
document.querySelectorAll('.mobile-menu-links a').forEach(function(link) {
link.addEventListener('click', function(event) {
event.preventDefault();
});
});

</script>
</body>
</html>
